name: Publish Release Assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing UTC release tag in the form vYYYYmmddHHmmss"
        required: true
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]{14}$ ]]; then
            echo "Release tag must match vYYYYmmddHHmmss" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  test:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint:all
      - run: bun run typecheck
      - run: bun test

  build-assets:
    needs: [validate, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            archive: copilot-api-muluser-linux-x64.tar.gz
            binary: copilot-api-muluser
          - target: bun-linux-arm64
            archive: copilot-api-muluser-linux-arm64.tar.gz
            binary: copilot-api-muluser
          - target: bun-darwin-x64
            archive: copilot-api-muluser-darwin-x64.tar.gz
            binary: copilot-api-muluser
          - target: bun-darwin-arm64
            archive: copilot-api-muluser-darwin-arm64.tar.gz
            binary: copilot-api-muluser
          - target: bun-windows-x64
            archive: copilot-api-muluser-windows-x64.zip
            binary: copilot-api-muluser.exe
          - target: bun-windows-arm64
            archive: copilot-api-muluser-windows-arm64.zip
            binary: copilot-api-muluser.exe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build executable
        run: |
          mkdir -p release
          bun build --compile --target=${{ matrix.target }} ./src/main.ts --outfile release/${{ matrix.binary }}
      - name: Package executable
        run: |
          if [[ "${{ matrix.archive }}" == *.zip ]]; then
            (cd release && zip ../${{ matrix.archive }} ${{ matrix.binary }})
          else
            tar -C release -czf ${{ matrix.archive }} ${{ matrix.binary }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    needs: [validate, build-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --generate-notes --title "$RELEASE_TAG"
          fi